# Render Blueprint — Threat Command Center (demo)
# Docs: https://render.com/docs/infrastructure-as-code
services:
  - type: web
    name: tcc-legacy
    runtime: docker
    dockerfilePath: legacy/Dockerfile
    dockerContext: legacy
    plan: free
    healthCheckPath: /api/raw-logs

  - type: web
    name: tcc-bridge
    runtime: docker
    dockerfilePath: bridge/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: LEGACY_API_URL
        fromService:
          name: tcc-legacy
          type: web
          property: hostport
      - key: DATA_DIR
        value: /data
      - key: DASHBOARD_DIR
        value: /dashboard
      - key: DEPLOY_ENV
        value: production-demo
      - key: LLM_BRIEF_ENABLED
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: tcc-data
      mountPath: /data
      sizeGB: 1
