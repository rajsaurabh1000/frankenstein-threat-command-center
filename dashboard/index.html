<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      document.documentElement.setAttribute("data-theme", "dark");
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Threat Command Center — Palo Alto Networks aligned SOC console for unified telemetry, landscape scoring, and AI-assisted response." />
    <title>Threat Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/themes.css" />
    <link rel="stylesheet" href="/static/world-ui.css" />
    <link rel="stylesheet" href="/static/motion.css" />
    <link rel="stylesheet" href="/static/leadership-layout.css" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/static/assets/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/static/assets/favicon.png" />
  </head>
  <body>
    <div id="app">
      <div class="boot-screen">
        <div class="boot-logo" aria-hidden="true"></div>
        <div class="boot-progress" aria-hidden="true"><div class="boot-progress-bar"></div></div>
        <p>Loading Threat Command Center</p>
      </div>
    </div>
    <script type="module">
      import("/static/app.mjs").catch((err) => {
        const root = document.getElementById("app");
        root.innerHTML =
          '<div class="boot-screen"><p style="color:#ff5c5c">Dashboard failed to load.</p>' +
          '<p style="font-size:12px;color:#94a3b8;max-width:480px;margin:1rem auto">' +
          String(err) +
          "</p><p style=\"font-size:12px;color:#94a3b8\">Try: rm -rf bridge/.venv && ./scripts/start-demo.sh</p></div>";
        console.error(err);
      });
    </script>
  </body>
</html>
